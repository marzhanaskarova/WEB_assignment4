<div class="container mt-5 mb-5">

    <h2>Registration Form</h2>

    <form action="#" method="get">

        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName"
                       placeholder="Enter first name" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName"
                       placeholder="Enter last name" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email"
                   placeholder="Enter email" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       minlength="6" placeholder="Enter password" required>
                <div class="form-text">At least 6 characters.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword"
                       minlength="6" placeholder="Confirm password" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Gender</label>

            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input"
                       id="male" name="gender" value="male" required>
                <label for="male" class="form-check-label">Male</label>
            </div>

            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input"
                       id="female" name="gender" value="female">
                <label for="female" class="form-check-label">Female</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Hobbies</label>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="reading">
                <label for="reading" class="form-check-label">Reading</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="sports">
                <label for="sports" class="form-check-label">Sports</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="music">
                <label for="music" class="form-check-label">Music</label>
            </div>
        </div>

        <div class="mb-4">
            <label for="country" class="form-label">Country</label>

            <select class="form-select" id="country" required>
                <option value="">Select country</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="Turkey">Turkey</option>
                <option value="USA">USA</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button type="submit" class="btn btn-dark">Register</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

    </form>
</div>

</body>
</html>
