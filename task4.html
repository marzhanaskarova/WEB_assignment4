
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">My Forms</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="task0.html">Task 0</a>
            <a class="nav-link" href="task1.html">Task 1</a>
            <a class="nav-link" href="task2.html">Task 2</a>
            <a class="nav-link" href="task3.html">Task 3</a>
            <a class="nav-link active" href="task4.html">Task 4</a>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <h2>Registration Form</h2>

    <form id="myForm" novalidate>
        <div class="row mt-3">
            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control"
                       placeholder="First name" required>
                <div class="invalid-feedback">Enter your first name.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control"
                       placeholder="Last name" required>
                <div class="invalid-feedback">Enter your last name.</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Email" required>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="Password" minlength="6" required>
                <div class="invalid-feedback">At least 6 characters.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control"
                       placeholder="Confirm password" required>
                <div class="invalid-feedback">Passwords must match.</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Gender</label>

            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female" required> Female
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Hobbies</label>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="reading">
                <label class="form-check-label" for="reading">Reading</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="sports">
                <label class="form-check-label" for="sports">Sports</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="music">
                <label class="form-check-label" for="music">Music</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Country</label>
            <select id="country" class="form-select" required>
                <option value="">Choose country</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="Turkey">Turkey</option>
                <option value="USA">USA</option>
                <option value="Other">Other</option>
            </select>
            <div class="invalid-feedback">Choose your country.</div>
        </div>

        <button type="submit" class="btn btn-dark">Register</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

        <p id="result" class="mt-3"></p>
    </form>
</div>

<script>
    const form = document.getElementById("myForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const fields = form.querySelectorAll("input[required], select");
        const result = document.getElementById("result");

        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity("Passwords do not match");
        } else {
            confirmPassword.setCustomValidity("");
        }

        let valid = true;

        fields.forEach(function(field) {
            if (field.type === "radio") {
                return;
            }

            if (field.checkValidity()) {
                field.classList.add("is-valid");
                field.classList.remove("is-invalid");
            } else {
                field.classList.add("is-invalid");
                field.classList.remove("is-valid");
                valid = false;
            }
        });

        if (!form.querySelector('input[name="gender"]:checked')) {
            valid = false;
        }

        if (valid) {
            result.textContent = "Registration successful!";
            result.className = "text-success mt-3";
        } else {
            result.textContent = "Please fill in the form correctly.";
            result.className = "text-danger mt-3";
        }
    });

    form.addEventListener("reset", function() {
        const fields = form.querySelectorAll("input, select");

        fields.forEach(function(field) {
            field.classList.remove("is-valid", "is-invalid");
        });

        document.getElementById("result").textContent = "";
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
