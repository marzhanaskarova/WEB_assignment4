
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">My Forms</a>

        <div class="navbar-nav">
            <a class="nav-link" href="task0.html">Task 0</a>
            <a class="nav-link" href="task1.html">Task 1</a>
            <a class="nav-link" href="task2.html">Task 2</a>
            <a class="nav-link active" href="task3.html">Task 3</a>
            <a class="nav-link" href="task4.html">Task 4</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Task 3: Form Validation</h2>

    <form id="myForm" novalidate>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" required>

            <div class="valid-feedback">
                Name is valid!
            </div>
            <div class="invalid-feedback">
                Please enter your name.
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>

            <div class="valid-feedback">
                Email is valid!
            </div>
            <div class="invalid-feedback">
                Please enter a valid email.
            </div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" required></textarea>

            <div class="valid-feedback">
                Message is valid!
            </div>
            <div class="invalid-feedback">
                Please enter your message.
            </div>
        </div>

        <button type="submit" class="btn btn-dark">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

        <p id="result" class="mt-3"></p>

    </form>
</div>

<script>
    const form = document.getElementById("myForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const fields = form.querySelectorAll("input, textarea");
        let isFormValid = true;

        fields.forEach(function(field) {
            if (field.checkValidity()) {
                field.classList.remove("is-invalid");
                field.classList.add("is-valid");
            } else {
                field.classList.remove("is-valid");
                field.classList.add("is-invalid");
                isFormValid = false;
            }
        });

        if (isFormValid) {
            result.textContent = "Form submitted successfully!";
            result.className = "text-success mt-3";
        } else {
            result.textContent = "Please correct the errors.";
            result.className = "text-danger mt-3";
        }
    });

    form.addEventListener("reset", function() {
        const fields = form.querySelectorAll("input, textarea");

        fields.forEach(function(field) {
            field.classList.remove("is-valid", "is-invalid");
        });

        result.textContent = "";
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
