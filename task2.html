<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">My Forms</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
                    <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap Contact Form -->
    <div class="container mt-5">
        <h1>Task 2: Bootstrap Form Styling</h1>
        <p>Contact us using the form below.</p>

        <form id="contactForm">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name"
                        class="form-control" placeholder="Enter your name">

                    <div class="form-text">
                        Please enter your full name.
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email"
                        class="form-control" placeholder="name@example.com">

                    <div class="form-text">
                        We will use your email to reply.
                    </div>
                </div>

                <div class="col-12 mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message"
                        class="form-control" rows="4"
                        placeholder="Write your message here"></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-dark">Submit</button>

            <p id="result" class="mt-3"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("contactForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("result").textContent =
                "Form submitted successfully!";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
